name: NOVA KZ Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          test -f nova-kz-apk-build.zip
          unzip -oq nova-kz-apk-build.zip -d .
          rm -f nova-kz-apk-build.zip
          test -f app/build.gradle.kts
          test -f settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run Debug unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify Debug APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee SHA256SUMS.txt
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-kz-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
