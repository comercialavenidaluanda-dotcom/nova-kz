name: Build NOVA KZ Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NOVA KZ
        uses: actions/checkout@v4

      - name: Extract NOVA KZ project from ZIP
        run: |
          if [ -f nova-kz-apk-build.zip ]; then
            unzip -oq nova-kz-apk-build.zip -d .
            rm -f nova-kz-apk-build.zip
          fi

      - name: Check Android project
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Ensure modern Fragment dependency for ActivityResult API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          dep = '    implementation("androidx.fragment:fragment-ktx:1.8.6")'
          pattern = r'implementation\(["\']androidx\.fragment:fragment-ktx:[^"\']+["\']\)'
          if "androidx.fragment:fragment-ktx" in s:
              s = re.sub(pattern, dep, s, count=1)
          else:
              marker = "dependencies {"
              if marker not in s:
                  raise SystemExit("dependencies block not found in app/build.gradle.kts")
              s = s.replace(marker, marker + "\n" + dep, 1)
          p.write_text(s, encoding="utf-8")
          print("Fragment dependency normalized to 1.8.6")
          PY
          grep -n "androidx.fragment:fragment-ktx" app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode NOVA KZ upload keystore
        shell: bash
        env:
          NOVA_KZ_KEYSTORE_BASE64: ${{ secrets.NOVA_KZ_KEYSTORE_BASE64 }}
        run: |
          test -n "$NOVA_KZ_KEYSTORE_BASE64"
          printf '%s' "$NOVA_KZ_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nova-kz-upload.jks"
          chmod 600 "$RUNNER_TEMP/nova-kz-upload.jks"
          test -s "$RUNNER_TEMP/nova-kz-upload.jks"

      - name: Build signed Release AAB and APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/nova-kz-upload.jks
          STORE_PASSWORD: ${{ secrets.NOVA_KZ_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOVA_KZ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOVA_KZ_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          gradle --no-daemon --stacktrace bundleRelease assembleRelease

      - name: Verify Release outputs
        run: |
          test -f app/build/outputs/bundle/release/app-release.aab
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Verify APK is release-signed
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload NOVA KZ Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-KZ-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
